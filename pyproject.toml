[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "grocer"
version = "0.1.0"
description = "Compare grocery prices across Zepto and Instamart via their official MCP servers and pick the cheapest split."
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Abhishek Chauhan" }]
dependencies = ["mcp>=2.2", "pyyaml>=6", "rich>=13"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
grocer = "grocer.cli:main"

[tool.setuptools]
packages = ["grocer", "grocer.platforms"]

[tool.pytest.ini_options]
testpaths = ["tests"]
