[project]
name = "grocer"
version = "0.1.0"
description = "Compare grocery prices across Zepto and Instamart via their official MCP servers and pick the cheapest split."
requires-python = ">=3.12"
dependencies = ["mcp>=2.2", "pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
grocer = "grocer.cli:main"

[tool.setuptools]
packages = ["grocer", "grocer.platforms"]

[tool.pytest.ini_options]
testpaths = ["tests"]
